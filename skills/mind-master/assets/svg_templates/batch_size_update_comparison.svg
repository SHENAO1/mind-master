<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img" aria-label="Full batch and mini batch update comparison">
  <defs>
    <marker id="arrow-batch" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563d8"/>
    </marker>
  </defs>
  <rect width="460" height="190" rx="16" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#1f4e5f" font-weight="700">
    <text x="104" y="32" text-anchor="middle">Full Batch</text>
    <text x="334" y="32" text-anchor="middle">Mini Batch</text>
  </g>
  <g fill="#e8f0ff" stroke="#2563d8" stroke-width="2">
    <rect x="28" y="52" width="24" height="24" rx="5"/>
    <rect x="58" y="52" width="24" height="24" rx="5"/>
    <rect x="88" y="52" width="24" height="24" rx="5"/>
    <rect x="118" y="52" width="24" height="24" rx="5"/>
    <rect x="148" y="52" width="24" height="24" rx="5"/>
    <rect x="258" y="52" width="24" height="24" rx="5"/>
    <rect x="288" y="52" width="24" height="24" rx="5"/>
    <rect x="318" y="52" width="24" height="24" rx="5"/>
    <rect x="348" y="52" width="24" height="24" rx="5"/>
    <rect x="378" y="52" width="24" height="24" rx="5"/>
  </g>
  <g fill="none" stroke="#2563d8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-batch)">
    <path d="M100 82 L100 124"/>
    <path d="M270 82 L270 112"/>
    <path d="M300 82 L300 124"/>
    <path d="M330 82 L330 112"/>
    <path d="M360 82 L360 124"/>
    <path d="M390 82 L390 112"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#5f6368">
    <text x="100" y="154" text-anchor="middle">one large update per epoch</text>
    <text x="334" y="154" text-anchor="middle">many smaller updates per epoch</text>
  </g>
</svg>
