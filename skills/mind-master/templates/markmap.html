<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.18.12"></script>
  <style>
    :root {
      --mm-bg: #fbfbf8;
      --mm-root: #1f4e5f;
      --mm-text: #202124;
      --mm-muted: #5f6368;
      --mm-line: #8b949e;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--mm-bg);
      color: var(--mm-text);
      font-family: {{FONT_STACK}};
    }

    body {
      overflow: auto;
    }

    .mind-master-shell {
      min-width: {{CANVAS_WIDTH}}px;
      min-height: {{CANVAS_HEIGHT}}px;
      padding: 24px;
      box-sizing: border-box;
    }

    body[data-layout-mode="balanced_two_sided"] .mind-master-shell {
      padding: 12px;
    }

    .mind-master-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 12px;
      color: var(--mm-muted);
      font-size: 14px;
    }

    .mind-master-header strong {
      color: var(--mm-root);
      font-size: 18px;
    }

    body[data-layout-mode="balanced_two_sided"] .mind-master-header {
      display: none;
    }

    .markmap {
      width: {{CANVAS_WIDTH}}px;
      height: {{CANVAS_HEIGHT}}px;
      background:
        linear-gradient(rgba(31, 78, 95, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 78, 95, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      border: 1px solid rgba(31, 78, 95, 0.12);
      border-radius: 8px;
      box-shadow: 0 14px 38px rgba(31, 78, 95, 0.10);
      overflow: hidden;
    }

    .markmap.is-hidden {
      display: none;
    }

    .markmap svg {
      width: 100%;
      height: 100%;
      font-family: {{FONT_STACK}};
    }

    .markmap .markmap-node > circle {
      fill: #ffffff;
      stroke: var(--mm-root);
      stroke-width: 1.4px;
    }

    .markmap .markmap-node text,
    .markmap .markmap-node foreignObject {
      color: var(--mm-text);
      fill: var(--mm-text);
      font-size: 16px;
      line-height: 1.45;
    }

    .markmap .markmap-node img {
      display: block;
      max-width: 360px;
      max-height: 240px;
      object-fit: contain;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      padding: 4px;
    }

    .markmap table {
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 13px;
      background: #ffffff;
    }

    .markmap th,
    .markmap td {
      border: 1px solid #d0d7de;
      padding: 5px 8px;
      white-space: nowrap;
    }

    .markmap th {
      background: #eef4f4;
      color: var(--mm-root);
      font-weight: 700;
    }

    .katex {
      font-size: 1.05em;
    }

    .balanced-layout {
      position: relative;
      width: max({{CANVAS_WIDTH}}px, 2100px);
      min-height: max({{CANVAS_HEIGHT}}px, 1080px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(118px, auto);
      gap: 12px 14px;
      align-items: stretch;
      padding: 18px 20px;
      box-sizing: border-box;
      background:
        linear-gradient(rgba(31, 78, 95, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 78, 95, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      border: 1px solid rgba(31, 78, 95, 0.12);
      border-radius: 8px;
      box-shadow: 0 14px 38px rgba(31, 78, 95, 0.10);
    }

    body:not([data-layout-mode="balanced_two_sided"]) .balanced-layout {
      display: none;
    }

    .balanced-live-connectors {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .balanced-live-connectors path {
      fill: none;
      stroke-linecap: round;
      opacity: 0.34;
      filter: none;
    }

    .balanced-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      min-width: 0;
      z-index: 1;
    }

    .balanced-side.left {
      grid-column: 1;
      grid-row: 1;
    }

    .balanced-side.right {
      grid-column: 3;
      grid-row: 1;
    }

    .balanced-root {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      z-index: 2;
      align-self: center;
      min-height: 370px;
      padding: 34px 26px;
      border: 4px solid #0f1f4f;
      border-radius: 18px;
      background: #ffffff;
      color: #0f1f4f;
      box-shadow: 0 16px 34px rgba(15, 31, 79, 0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .balanced-root-kicker {
      margin-bottom: 8px;
      color: #1d4ed8;
      font-size: 20px;
      font-weight: 900;
    }

    .balanced-root h1 {
      margin: 0 0 12px;
      font-size: 39px;
      line-height: 1.12;
    }

    .balanced-root p {
      margin: 0 auto 12px;
      max-width: 270px;
      font-size: 16px;
      line-height: 1.45;
      color: #172554;
    }

    .balanced-root ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      line-height: 1.55;
      color: #1d4ed8;
      font-weight: 700;
    }

    .balanced-branch {
      position: relative;
      min-width: 0;
      display: grid;
      align-items: center;
      gap: 10px;
      --branch-color: var(--mm-root);
    }

    .balanced-branch[data-side="left"] {
      grid-template-columns: minmax(0, 1fr) 170px;
    }

    .balanced-branch[data-side="right"] {
      grid-template-columns: 170px minmax(0, 1fr);
    }

    .balanced-branch.is-dominant {
      min-height: 0;
    }

    .balanced-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      max-width: 310px;
      padding: 9px 10px;
      border: 1.5px solid color-mix(in srgb, var(--branch-color) 76%, #ffffff);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 5px 16px rgba(31, 78, 95, 0.07);
      box-sizing: border-box;
      break-inside: avoid;
    }

    .balanced-hub {
      max-width: none;
      text-align: center;
      border-width: 2px;
      box-shadow: 0 8px 18px rgba(31, 78, 95, 0.12);
    }

    .balanced-node.has-visual {
      max-width: 350px;
    }

    .balanced-branch-children > .balanced-node.has-visual {
      width: 100%;
      justify-self: start;
    }

    .balanced-branch-children > .balanced-node.has-multiple-visuals,
    .balanced-branch-children > .balanced-node.type-table {
      grid-column: 1 / -1;
      max-width: none;
    }

    .balanced-side.left .balanced-branch-children > .balanced-node.has-visual {
      justify-self: end;
    }

    .balanced-node.depth-0 {
      border-top: 5px solid var(--branch-color);
      background: rgba(255, 255, 255, 0.98);
    }

    .balanced-node.depth-1,
    .balanced-node.depth-2,
    .balanced-node.depth-3,
    .balanced-node.depth-4 {
      box-shadow: none;
      background: #ffffff;
    }

    .balanced-side.left .balanced-hub {
      grid-column: 2;
      grid-row: 1;
    }

    .balanced-side.left .balanced-branch-children {
      grid-column: 1;
      grid-row: 1;
      justify-content: end;
    }

    .balanced-side.right .balanced-hub {
      grid-column: 1;
      grid-row: 1;
    }

    .balanced-side.right .balanced-branch-children {
      grid-column: 2;
      grid-row: 1;
      justify-content: start;
    }

    .balanced-node h2,
    .balanced-node h3,
    .balanced-node h4,
    .balanced-node h5,
    .balanced-node h6 {
      margin: 0 0 7px;
      color: var(--branch-color);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .balanced-node-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balanced-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border: 1.5px solid color-mix(in srgb, var(--branch-color) 70%, #ffffff);
      border-radius: 8px;
      background: color-mix(in srgb, var(--branch-color) 9%, #ffffff);
    }

    .balanced-title-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--branch-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .balanced-title-text {
      min-width: 0;
    }

    .balanced-node h2 {
      font-size: 23px;
    }

    .balanced-node h3 {
      font-size: 16px;
    }

    .balanced-node h4,
    .balanced-node h5,
    .balanced-node h6 {
      font-size: 13px;
    }

    .balanced-description,
    .balanced-summary,
    .balanced-notes {
      margin: 0 0 7px;
      color: var(--mm-text);
      font-size: 12px;
      line-height: 1.55;
    }

    .balanced-summary {
      color: var(--mm-muted);
    }

    .balanced-notes {
      padding-left: 18px;
    }

    .balanced-keyword-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .balanced-keyword-pills span {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid color-mix(in srgb, var(--branch-color) 55%, #ffffff);
      border-radius: 999px;
      color: var(--branch-color);
      background: color-mix(in srgb, var(--branch-color) 8%, #ffffff);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .balanced-branch-children {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 8px;
      align-items: start;
    }

    .balanced-branch.is-dominant .balanced-branch-children {
      grid-template-columns: repeat(2, minmax(250px, 1fr));
    }

    .balanced-node-children {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .balanced-leaf-list {
      margin: 6px 0 0;
      padding: 0 0 0 24px;
      color: var(--mm-text);
      font-size: 11.5px;
      line-height: 1.42;
    }

    .balanced-leaf-list li {
      margin: 3px 0;
      padding-left: 2px;
      marker: none;
    }

    .balanced-leaf-list li::marker {
      color: var(--branch-color);
      font-weight: 800;
    }

    .balanced-leaf-list li {
      break-inside: avoid;
    }

    .balanced-leaf-list.is-plain {
      margin: 6px 0 0;
      padding: 0;
      list-style: none;
    }

    .balanced-node.type-table,
    .balanced-table-wrap {
      grid-column: 1 / -1;
      max-width: none;
    }

    .balanced-table-wrap {
      margin-top: 8px;
      overflow-x: auto;
    }

    .balanced-table-wrap table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      font-size: 12px;
    }

    .balanced-table-wrap th,
    .balanced-table-wrap td {
      border: 1px solid #d0d7de;
      padding: 5px 7px;
      white-space: nowrap;
    }

    .balanced-table-wrap th {
      background: #eef4f4;
      color: var(--branch-color);
    }

    .balanced-equations {
      margin: 8px 0;
    }

    .balanced-equation {
      display: block;
      overflow-x: auto;
      padding: 8px 10px;
      border-radius: 6px;
      background: #f3f7f7;
      color: var(--branch-color);
      font-size: 13px;
    }

    .balanced-images,
    .balanced-evidence-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .balanced-images figure,
    .balanced-evidence-grid figure {
      margin: 0;
      padding: 8px;
      border: 1px solid color-mix(in srgb, var(--branch-color) 34%, #d0d7de);
      border-radius: 7px;
      background: #ffffff;
    }

    .balanced-evidence-title {
      margin: 0 0 6px;
      color: var(--branch-color);
      font-size: 12px;
      line-height: 1.28;
      font-weight: 900;
    }

    .balanced-images img,
    .balanced-evidence-grid img {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      max-height: 170px;
      object-fit: contain;
    }

    .balanced-images figcaption,
    .balanced-evidence-grid figcaption {
      margin-top: 5px;
      color: var(--mm-muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .balanced-source-label {
      display: inline-flex;
      margin-right: 6px;
      padding: 1px 5px;
      border-radius: 999px;
      color: #ffffff;
      background: var(--branch-color);
      font-size: 10px;
      font-weight: 800;
    }

    .balanced-preserve-image.is-preserve_crop {
      border-style: dashed;
      border-color: color-mix(in srgb, var(--branch-color) 55%, #ffffff);
    }

    .balanced-image-callouts {
      margin: 6px 0 0;
      padding-left: 17px;
      color: var(--mm-text);
      font-size: 10.5px;
      line-height: 1.36;
      border-top: 1px solid color-mix(in srgb, var(--branch-color) 18%, #ffffff);
      padding-top: 6px;
    }

    .balanced-image-callouts li {
      margin: 2px 0;
      font-weight: 700;
    }

    .balanced-redraws {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .balanced-redraw-card {
      margin: 0;
      padding: 8px;
      border: 1px dashed color-mix(in srgb, var(--branch-color) 70%, #ffffff);
      border-radius: 7px;
      background: #ffffff;
    }

    .balanced-redraw-card svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .balanced-redraw-card rect {
      fill: color-mix(in srgb, var(--branch-color) 7%, #ffffff);
      stroke: var(--branch-color);
      stroke-width: 2;
    }

    .balanced-redraw-card path {
      fill: none;
      stroke: var(--branch-color);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .balanced-redraw-card circle {
      fill: var(--branch-color);
    }

    .balanced-redraw-card text {
      fill: var(--branch-color);
      font-size: 12px;
      font-weight: 700;
    }

    .balanced-redraw-card figcaption {
      margin-top: 5px;
      color: var(--mm-muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .balanced-learning-band {
      grid-column: 1 / 4;
      grid-row: 2;
      z-index: 1;
      display: grid;
      grid-template-columns: 120px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
      min-height: 118px;
      max-height: 155px;
      padding: 10px 14px;
      --branch-color: #7c3aed;
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid rgba(124, 58, 237, 0.45);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(31, 78, 95, 0.08);
      overflow: hidden;
    }

    .balanced-band-title {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5b21b6;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      border-right: 1px dashed rgba(124, 58, 237, 0.35);
    }

    .balanced-band-group {
      min-width: 0;
      overflow: hidden;
    }

    .balanced-band-group h3 {
      margin: 0 0 5px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #6d28d9;
      font-size: 13px;
      line-height: 1.2;
    }

    .balanced-band-group .balanced-title-icon {
      width: 22px;
      height: 22px;
      flex-basis: 22px;
      border-radius: 7px;
      --branch-color: #7c3aed;
    }

    .balanced-band-group .balanced-title-icon svg {
      width: 14px;
      height: 14px;
    }

    .balanced-learning-band .balanced-keyword-pills {
      gap: 4px;
      margin-top: 0;
    }

    .balanced-learning-band .balanced-keyword-pills span {
      min-height: 20px;
      padding: 2px 7px;
      font-size: 10.5px;
    }

    .balanced-band-list {
      margin: 0;
      padding-left: 18px;
      font-size: 10.8px;
      line-height: 1.35;
      color: var(--mm-text);
    }

    .balanced-band-list li {
      margin: 1px 0;
    }

    .mind-master-source {
      display: none;
    }
  </style>
</head>
<body data-layout-mode="{{LAYOUT_MODE}}">
  <main class="mind-master-shell">
    <header class="mind-master-header">
      <strong>{{TITLE}}</strong>
      <span>{{META}}</span>
    </header>
    <div class="markmap {{MARKMAP_CLASS}}">
      <script type="text/template">{{MARKDOWN}}</script>
    </div>
    {{BALANCED_HTML}}
  </main>
  <pre class="mind-master-source" id="mind-master-markdown">{{MARKDOWN}}</pre>
  <script id="mind-master-layout-profile" type="application/json">{{LAYOUT_PROFILE_JSON}}</script>
  <script>
    window.MIND_MASTER_READY = false;
    window.MIND_MASTER_LAYOUT_PROFILE = JSON.parse(document.getElementById('mind-master-layout-profile').textContent || '{}');
    function rectInLayout(element, layoutRect) {
      const rect = element.getBoundingClientRect();
      return {
        left: rect.left - layoutRect.left,
        right: rect.right - layoutRect.left,
        top: rect.top - layoutRect.top,
        bottom: rect.bottom - layoutRect.top,
        width: rect.width,
        height: rect.height,
        cx: rect.left - layoutRect.left + rect.width / 2,
        cy: rect.top - layoutRect.top + rect.height / 2
      };
    }
    function connectorPath(startX, startY, endX, endY, side) {
      const distance = Math.max(80, Math.abs(endX - startX));
      const curve = Math.min(260, Math.max(80, distance * 0.55));
      const c1 = side === 'left' ? startX - curve : startX + curve;
      const c2 = side === 'left' ? endX + curve : endX - curve;
      return `M ${startX.toFixed(1)} ${startY.toFixed(1)} C ${c1.toFixed(1)} ${startY.toFixed(1)}, ${c2.toFixed(1)} ${endY.toFixed(1)}, ${endX.toFixed(1)} ${endY.toFixed(1)}`;
    }
    function drawBalancedConnectors() {
      const layout = document.querySelector('.balanced-layout');
      if (!layout) return 0;
      const svg = layout.querySelector('.balanced-live-connectors');
      const root = layout.querySelector('.balanced-root');
      if (!svg || !root) return 0;
      const layoutRect = layout.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${layoutRect.width.toFixed(0)} ${layoutRect.height.toFixed(0)}`);
      svg.setAttribute('width', layoutRect.width.toFixed(0));
      svg.setAttribute('height', layoutRect.height.toFixed(0));
      svg.replaceChildren();

      const rootRect = rectInLayout(root, layoutRect);
      let count = 0;
      layout.querySelectorAll('.balanced-branch').forEach((branch) => {
        const side = branch.dataset.side || 'right';
        const hub = branch.querySelector('.balanced-hub');
        if (!hub) return;
        const color = getComputedStyle(branch).getPropertyValue('--branch-color').trim() || '#1f4e5f';
        const hubRect = rectInLayout(hub, layoutRect);
        const startX = side === 'left' ? rootRect.left : rootRect.right;
        const endX = side === 'left' ? hubRect.right : hubRect.left;
        const rootPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        rootPath.setAttribute('d', connectorPath(startX, rootRect.cy, endX, hubRect.cy, side));
        rootPath.setAttribute('stroke', color);
        rootPath.setAttribute('stroke-width', '3.2');
        rootPath.setAttribute('opacity', '0.34');
        rootPath.setAttribute('data-kind', 'root-branch');
        svg.appendChild(rootPath);
        count += 1;

        branch.querySelectorAll('.balanced-branch-children > .balanced-node').forEach((child) => {
          const childRect = rectInLayout(child, layoutRect);
          const childStartX = side === 'left' ? hubRect.left : hubRect.right;
          const childEndX = side === 'left' ? childRect.right : childRect.left;
          const childPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          childPath.setAttribute('d', connectorPath(childStartX, hubRect.cy, childEndX, childRect.cy, side));
          childPath.setAttribute('stroke', color);
          childPath.setAttribute('stroke-width', '1.4');
          childPath.setAttribute('opacity', '0.28');
          childPath.setAttribute('data-kind', 'branch-child');
          svg.appendChild(childPath);
          count += 1;
        });
      });
      return count;
    }
    function renderMath() {
      if (!window.renderMathInElement) return;
      window.renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
      });
    }
    window.setTimeout(function markReady() {
      renderMath();
      const mode = document.body.dataset.layoutMode;
      const connectorCount = mode === 'balanced_two_sided' ? drawBalancedConnectors() : 0;
      window.MIND_MASTER_READY = mode === 'balanced_two_sided'
        ? !!document.querySelector('.balanced-layout') && connectorCount > 0
        : !!document.querySelector('.markmap svg');
    }, 1800);
    window.addEventListener('load', function () {
      window.setTimeout(drawBalancedConnectors, 150);
      window.setTimeout(drawBalancedConnectors, 900);
      window.setTimeout(drawBalancedConnectors, 1800);
    });
    window.addEventListener('resize', drawBalancedConnectors);
  </script>
