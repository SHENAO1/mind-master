<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.18.12"></script>
  <style>
    :root {
      --mm-bg: #fbfbf8;
      --mm-root: #1f4e5f;
      --mm-text: #202124;
      --mm-muted: #5f6368;
      --mm-line: #8b949e;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--mm-bg);
      color: var(--mm-text);
      font-family: {{FONT_STACK}};
    }

    body {
      overflow: auto;
    }

    .mind-master-shell {
      min-width: {{CANVAS_WIDTH}}px;
      min-height: {{CANVAS_HEIGHT}}px;
      padding: 24px;
      box-sizing: border-box;
    }

    body[data-layout-mode="balanced_two_sided"] .mind-master-shell {
      padding: 0;
    }

    .mind-master-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 12px;
      color: var(--mm-muted);
      font-size: 14px;
    }

    .mind-master-header strong {
      color: var(--mm-root);
      font-size: 18px;
    }

    body[data-layout-mode="balanced_two_sided"] .mind-master-header {
      display: none;
    }

    .markmap {
      width: {{CANVAS_WIDTH}}px;
      height: {{CANVAS_HEIGHT}}px;
      background:
        linear-gradient(rgba(31, 78, 95, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 78, 95, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      border: 1px solid rgba(31, 78, 95, 0.12);
      border-radius: 8px;
      box-shadow: 0 14px 38px rgba(31, 78, 95, 0.10);
      overflow: hidden;
    }

    .markmap.is-hidden {
      display: none;
    }

    .markmap svg {
      width: 100%;
      height: 100%;
      font-family: {{FONT_STACK}};
    }

    .markmap .markmap-node > circle {
      fill: #ffffff;
      stroke: var(--mm-root);
      stroke-width: 1.4px;
    }

    .markmap .markmap-node text,
    .markmap .markmap-node foreignObject {
      color: var(--mm-text);
      fill: var(--mm-text);
      font-size: 16px;
      line-height: 1.45;
    }

    .markmap .markmap-node img {
      display: block;
      max-width: 360px;
      max-height: 240px;
      object-fit: contain;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      padding: 4px;
    }

    .markmap table {
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 13px;
      background: #ffffff;
    }

    .markmap th,
    .markmap td {
      border: 1px solid #d0d7de;
      padding: 5px 8px;
      white-space: nowrap;
    }

    .markmap th {
      background: #eef4f4;
      color: var(--mm-root);
      font-weight: 700;
    }

    .katex {
      font-size: 1.05em;
    }

    .balanced-layout {
      position: relative;
      width: max({{CANVAS_WIDTH}}px, 2240px);
      min-height: max({{CANVAS_HEIGHT}}px, 1200px);
      display: grid;
      grid-template-columns: minmax(0, 930px) 320px minmax(0, 930px);
      grid-template-rows: minmax(0, 1fr) minmax(104px, auto);
      gap: 10px 12px;
      align-items: stretch;
      padding: 14px 16px;
      box-sizing: border-box;
      background:
        linear-gradient(rgba(31, 78, 95, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 78, 95, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      border: 1px solid rgba(31, 78, 95, 0.12);
      border-radius: 8px;
      box-shadow: 0 14px 38px rgba(31, 78, 95, 0.10);
    }

    body:not([data-layout-mode="balanced_two_sided"]) .balanced-layout {
      display: none;
    }

    .balanced-live-connectors {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .balanced-live-connectors path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.38;
      filter: none;
    }

    .balanced-live-connectors .connector-dot {
      fill: #ffffff;
      stroke-width: 1.6;
      opacity: 0.92;
    }

    .balanced-side {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 9px;
      min-width: 0;
      z-index: 1;
    }

    .balanced-side.left {
      grid-column: 1;
      grid-row: 1;
    }

    .balanced-side.right {
      grid-column: 3;
      grid-row: 1;
    }

    .balanced-root {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      z-index: 2;
      align-self: center;
      min-height: 315px;
      padding: 28px 22px;
      border: 4px solid #0f1f4f;
      border-radius: 16px;
      background: #ffffff;
      color: #0f1f4f;
      box-shadow: 0 16px 34px rgba(15, 31, 79, 0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .balanced-root-kicker {
      margin-bottom: 8px;
      color: #1d4ed8;
      font-size: 20px;
      font-weight: 900;
    }

    .balanced-root h1 {
      margin: 0 0 12px;
      font-size: 35px;
      line-height: 1.12;
    }

    .balanced-root p {
      margin: 0 auto 12px;
      max-width: 270px;
      font-size: 16px;
      line-height: 1.45;
      color: #172554;
    }

    .balanced-root ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      line-height: 1.55;
      color: #1d4ed8;
      font-weight: 700;
    }

    .balanced-branch {
      position: relative;
      min-width: 0;
      display: grid;
      align-items: center;
      gap: 8px;
      --branch-color: var(--mm-root);
    }

    .balanced-branch[data-side="left"] {
      grid-template-columns: minmax(0, 1fr) 245px;
    }

    .balanced-branch[data-side="right"] {
      grid-template-columns: 245px minmax(0, 1fr);
    }

    .balanced-branch.is-dominant {
      min-height: 0;
    }

    .balanced-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      max-width: 320px;
      padding: 7px 9px;
      border: 1.5px solid color-mix(in srgb, var(--branch-color) 76%, #ffffff);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 5px 16px rgba(31, 78, 95, 0.07);
      box-sizing: border-box;
      break-inside: avoid;
    }

    .balanced-hub {
      max-width: none;
      text-align: center;
      border-width: 2px;
      box-shadow: 0 8px 18px rgba(31, 78, 95, 0.12);
    }

    .balanced-node.has-visual {
      max-width: 385px;
    }

    .balanced-branch-children > .balanced-node.has-visual {
      width: 100%;
      justify-self: start;
    }

    .balanced-branch-children > .balanced-node.has-multiple-visuals,
    .balanced-branch-children > .balanced-node.type-table {
      grid-column: 1 / -1;
      max-width: none;
    }

    .balanced-branch.is-batch-zone .balanced-branch-children > .balanced-node.type-table {
      grid-column: auto;
      width: 100%;
    }

    .balanced-side.left .balanced-branch-children > .balanced-node.has-visual {
      justify-self: end;
    }

    .balanced-node.depth-0 {
      border-top: 5px solid var(--branch-color);
      background: rgba(255, 255, 255, 0.98);
      padding: 12px 10px;
    }

    .balanced-branch.is-summary-zone {
      padding: 8px;
      border: 1.5px solid rgba(249, 115, 22, 0.36);
      border-radius: 12px;
      background: rgba(255, 247, 237, 0.72);
    }

    .balanced-branch.is-summary-zone .balanced-node {
      background: #fffaf4;
    }

    .balanced-node.depth-1,
    .balanced-node.depth-2,
    .balanced-node.depth-3,
    .balanced-node.depth-4 {
      box-shadow: none;
      background: #ffffff;
    }

    .balanced-side.left .balanced-hub {
      grid-column: 2;
      grid-row: 1;
    }

    .balanced-side.left .balanced-branch-children {
      grid-column: 1;
      grid-row: 1;
      justify-content: end;
    }

    .balanced-side.right .balanced-hub {
      grid-column: 1;
      grid-row: 1;
    }

    .balanced-side.right .balanced-branch-children {
      grid-column: 2;
      grid-row: 1;
      justify-content: start;
    }

    .balanced-node h2,
    .balanced-node h3,
    .balanced-node h4,
    .balanced-node h5,
    .balanced-node h6 {
      margin: 0 0 7px;
      color: var(--branch-color);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .balanced-node-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balanced-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border: 1.5px solid color-mix(in srgb, var(--branch-color) 70%, #ffffff);
      border-radius: 8px;
      background: color-mix(in srgb, var(--branch-color) 9%, #ffffff);
    }

    .balanced-title-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--branch-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .balanced-title-text {
      min-width: 0;
    }

    .balanced-branch-title {
      justify-content: center;
      gap: 7px;
      margin-bottom: 0;
      text-align: left;
    }

    .balanced-branch-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 42px;
      padding: 0 7px;
      border-radius: 10px;
      background: var(--branch-color);
      color: #ffffff;
      font-size: 25px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0;
    }

    .balanced-branch-main,
    .balanced-branch-subtitle {
      display: block;
    }

    .balanced-branch-main {
      font-weight: 900;
      font-size: 21px;
      line-height: 1.15;
    }

    .balanced-branch-subtitle {
      margin-top: 4px;
      color: var(--mm-muted);
      font-size: 11px;
      line-height: 1.25;
      font-weight: 700;
    }

    .balanced-node h2 {
      font-size: 23px;
    }

    .balanced-node h3 {
      font-size: 16px;
    }

    .balanced-node h4,
    .balanced-node h5,
    .balanced-node h6 {
      font-size: 13px;
    }

    .balanced-description,
    .balanced-summary,
    .balanced-notes {
      margin: 0 0 7px;
      color: var(--mm-text);
      font-size: 12px;
      line-height: 1.55;
    }

    .balanced-summary {
      color: var(--mm-muted);
    }

    .balanced-notes {
      padding-left: 18px;
    }

    .balanced-keyword-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .balanced-keyword-pills span {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid color-mix(in srgb, var(--branch-color) 55%, #ffffff);
      border-radius: 999px;
      color: var(--branch-color);
      background: color-mix(in srgb, var(--branch-color) 8%, #ffffff);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .balanced-branch-children {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(285px, 1fr));
      gap: 7px;
      align-items: start;
    }

    .balanced-branch.is-dominant .balanced-branch-children {
      grid-template-columns: repeat(2, minmax(300px, 1fr));
    }

    .balanced-node-children {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .balanced-leaf-list {
      margin: 5px 0 0;
      padding: 0 0 0 24px;
      color: var(--mm-text);
      font-size: 11px;
      line-height: 1.35;
    }

    .balanced-leaf-list li {
      margin: 2px 0;
      padding-left: 2px;
      marker: none;
    }

    .balanced-leaf-list li::marker {
      color: var(--branch-color);
      font-weight: 800;
    }

    .balanced-leaf-list li {
      break-inside: avoid;
    }

    .balanced-leaf-list.is-plain {
      margin: 6px 0 0;
      padding: 0;
      list-style: none;
    }

    .balanced-node.type-table,
    .balanced-table-wrap {
      grid-column: 1 / -1;
      max-width: none;
    }

    .balanced-table-wrap {
      margin-top: 8px;
      overflow-x: auto;
    }

    .balanced-table-wrap table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      font-size: 11px;
    }

    .balanced-table-wrap th,
    .balanced-table-wrap td {
      border: 1px solid #d0d7de;
      padding: 3px 6px;
      white-space: nowrap;
    }

    .balanced-table-wrap th {
      background: #eef4f4;
      color: var(--branch-color);
    }

    .balanced-comparison-matrix tbody td:first-child {
      color: #334155;
      font-weight: 800;
      background: color-mix(in srgb, var(--branch-color) 5%, #ffffff);
    }

    .balanced-table-wrap .balanced-comparison-matrix {
      width: 100%;
      min-width: 100%;
      table-layout: fixed;
      font-size: 10px;
    }

    .balanced-comparison-matrix th,
    .balanced-comparison-matrix td {
      padding: 2px 5px;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.1;
    }

    .balanced-equations {
      margin: 8px 0;
    }

    .balanced-equation {
      display: block;
      overflow-x: auto;
      padding: 8px 10px;
      border-radius: 6px;
      background: #f3f7f7;
      color: var(--branch-color);
      font-size: 13px;
    }

    .balanced-images,
    .balanced-evidence-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 7px;
      margin-top: 7px;
    }

    .balanced-images figure,
    .balanced-evidence-grid figure {
      margin: 0;
      padding: 6px;
      border: 1px solid color-mix(in srgb, var(--branch-color) 34%, #d0d7de);
      border-radius: 7px;
      background: #ffffff;
      box-sizing: border-box;
      max-width: 100%;
      overflow: hidden;
      contain: paint;
    }

    .balanced-evidence-title {
      margin: 0 0 6px;
      color: var(--branch-color);
      font-size: 12px;
      line-height: 1.28;
      font-weight: 900;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .balanced-evidence-body {
      display: grid;
      grid-template-columns: minmax(215px, 1fr) minmax(76px, 0.34fr);
      gap: 5px;
      align-items: center;
      min-width: 0;
      max-width: 100%;
    }

    .balanced-evidence-media {
      position: relative;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border-radius: 5px;
    }

    .balanced-evidence-overlays {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-start;
      max-width: calc(100% - 12px);
      pointer-events: none;
      box-sizing: border-box;
    }

    .balanced-evidence-overlay {
      display: inline-flex;
      max-width: 100%;
      box-sizing: border-box;
      padding: 2px 6px;
      border: 1px solid color-mix(in srgb, var(--branch-color) 45%, #ffffff);
      border-radius: 999px;
      color: color-mix(in srgb, var(--branch-color) 82%, #111827);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.10);
      font-size: 9.2px;
      line-height: 1.2;
      font-weight: 900;
      white-space: normal;
      overflow-wrap: anywhere;
      overflow: hidden;
      display: -webkit-inline-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .balanced-evidence-card[data-source-id="fig_p38_004"] .balanced-evidence-overlays {
      inset: 6px 6px auto auto;
      align-items: flex-end;
      max-width: calc(100% - 12px);
    }

    .balanced-evidence-card[data-source-id="fig_p46_006"] .balanced-evidence-overlays {
      inset: auto 8px 8px auto;
      align-items: flex-end;
      max-width: 58%;
    }

    .balanced-evidence-card[data-source-id="fig_p63_008"] .balanced-evidence-overlays {
      inset: auto auto 8px 8px;
      max-width: 68%;
    }

    .balanced-images img,
    .balanced-evidence-grid img,
    .balanced-evidence-media > svg {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      max-height: 148px;
      object-fit: contain;
    }

    .balanced-evidence-card[data-source-id="fig_p38_004"] .balanced-evidence-body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
    }

    .balanced-evidence-card[data-source-id="fig_p38_004"] img {
      max-height: 132px;
    }

    .balanced-evidence-card[data-source-id="fig_p38_004"] .balanced-image-callouts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
    }

    .balanced-evidence-card[data-source-id="fig_p38_004"] .balanced-image-callouts li {
      margin-bottom: 0;
    }

    .balanced-evidence-card[data-source-id="fig_p46_006"] img {
      max-height: 138px;
    }

    .balanced-evidence-card[data-source-id="fig_p38_004"],
    .balanced-evidence-card[data-source-id="fig_p63_008"] {
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--branch-color) 18%, transparent);
    }

    .balanced-images figcaption,
    .balanced-evidence-grid figcaption {
      margin-top: 4px;
      color: var(--mm-muted);
      font-size: 10px;
      line-height: 1.25;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .balanced-source-label {
      display: inline-flex;
      margin-right: 6px;
      padding: 1px 5px;
      border-radius: 999px;
      color: #ffffff;
      background: var(--branch-color);
      font-size: 10px;
      font-weight: 800;
    }

    .balanced-preserve-image.is-preserve_crop {
      border-style: dashed;
      border-color: color-mix(in srgb, var(--branch-color) 55%, #ffffff);
    }

    .balanced-image-callouts {
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--mm-text);
      font-size: 10px;
      line-height: 1.25;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    .balanced-image-callouts li {
      margin: 0 0 4px;
      padding: 4px 6px;
      border-radius: 7px;
      color: color-mix(in srgb, var(--branch-color) 78%, #111827);
      background: color-mix(in srgb, var(--branch-color) 8%, #ffffff);
      font-weight: 700;
      max-width: 100%;
      box-sizing: border-box;
      white-space: normal;
      overflow-wrap: anywhere;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .balanced-redraws {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .balanced-redraw-card {
      margin: 0;
      padding: 6px;
      border: 1px dashed color-mix(in srgb, var(--branch-color) 70%, #ffffff);
      border-radius: 7px;
      background: #ffffff;
    }

    .balanced-redraw-card svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 104px;
    }

    .balanced-redraw-card rect {
      fill: color-mix(in srgb, var(--branch-color) 7%, #ffffff);
      stroke: var(--branch-color);
      stroke-width: 2;
    }

    .balanced-redraw-card path {
      fill: none;
      stroke: var(--branch-color);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .balanced-redraw-card circle {
      fill: var(--branch-color);
    }

    .balanced-redraw-card text {
      fill: var(--branch-color);
      font-size: 12px;
      font-weight: 700;
    }

    .balanced-redraw-card figcaption {
      margin-top: 5px;
      color: var(--mm-muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .balanced-learning-band {
      grid-column: 1 / 4;
      grid-row: 2;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
      min-height: 104px;
      max-height: 135px;
      padding: 9px 12px;
      --branch-color: #7c3aed;
      background: rgba(250, 245, 255, 0.94);
      border: 1.5px solid rgba(124, 58, 237, 0.45);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(31, 78, 95, 0.08);
      overflow: hidden;
    }

    .balanced-band-title {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5b21b6;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      border-right: 1px dashed rgba(124, 58, 237, 0.35);
    }

    .balanced-band-group {
      min-width: 0;
      overflow: hidden;
    }

    .balanced-band-group h3 {
      margin: 0 0 5px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #6d28d9;
      font-size: 13px;
      line-height: 1.2;
    }

    .balanced-band-group .balanced-title-icon {
      width: 22px;
      height: 22px;
      flex-basis: 22px;
      border-radius: 7px;
      --branch-color: #7c3aed;
    }

    .balanced-band-group .balanced-title-icon svg {
      width: 14px;
      height: 14px;
    }

    .balanced-learning-band .balanced-keyword-pills {
      gap: 4px;
      margin-top: 0;
    }

    .balanced-learning-band .balanced-keyword-pills span {
      min-height: 20px;
      padding: 2px 7px;
      font-size: 10.5px;
    }

    .balanced-band-list {
      margin: 0;
      padding-left: 18px;
      font-size: 10.8px;
      line-height: 1.35;
      color: var(--mm-text);
    }

    .balanced-band-list li {
      margin: 1px 0;
    }

    .mind-master-source {
      display: none;
    }
  </style>
</head>
<body data-layout-mode="{{LAYOUT_MODE}}">
  <main class="mind-master-shell">
    <header class="mind-master-header">
      <strong>{{TITLE}}</strong>
      <span>{{META}}</span>
    </header>
    <div class="markmap {{MARKMAP_CLASS}}">
      <script type="text/template">{{MARKDOWN}}</script>
    </div>
    {{BALANCED_HTML}}
  </main>
  <pre class="mind-master-source" id="mind-master-markdown">{{MARKDOWN}}</pre>
  <script id="mind-master-layout-profile" type="application/json">{{LAYOUT_PROFILE_JSON}}</script>
  <script>
    window.MIND_MASTER_READY = false;
    window.MIND_MASTER_LAYOUT_PROFILE = JSON.parse(document.getElementById('mind-master-layout-profile').textContent || '{}');
    function rectInLayout(element, layoutRect) {
      const rect = element.getBoundingClientRect();
      return {
        left: rect.left - layoutRect.left,
        right: rect.right - layoutRect.left,
        top: rect.top - layoutRect.top,
        bottom: rect.bottom - layoutRect.top,
        width: rect.width,
        height: rect.height,
        cx: rect.left - layoutRect.left + rect.width / 2,
        cy: rect.top - layoutRect.top + rect.height / 2
      };
    }
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }
    function edgePort(rect, side, targetY, inset = 16) {
      const minY = rect.top + Math.min(inset, rect.height / 2);
      const maxY = rect.bottom - Math.min(inset, rect.height / 2);
      return {
        x: side === 'left' ? rect.left : rect.right,
        y: clamp(targetY, minY, maxY)
      };
    }
    function pathFromPoints(points) {
      return points.map((point, index) => {
        const prefix = index === 0 ? 'M' : 'L';
        return `${prefix} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`;
      }).join(' ');
    }
    function connectorRoute(start, end, side, role) {
      const gap = Math.abs(end.x - start.x);
      if (role === 'branch-child') {
        if (gap < 18) {
          return [start, end];
        }
        const midX = (start.x + end.x) / 2;
        return [start, { x: midX, y: start.y }, { x: midX, y: end.y }, end];
      }
      const sign = side === 'left' ? -1 : 1;
      const stub = Math.min(56, Math.max(28, gap * 0.24));
      const startStub = { x: start.x + sign * stub, y: start.y };
      const endStub = { x: end.x - sign * stub, y: end.y };
      const midX = (startStub.x + endStub.x) / 2;
      return [start, startStub, { x: midX, y: start.y }, { x: midX, y: end.y }, endStub, end];
    }
    function segmentIntersectsRect(a, b, rect, padding = 3) {
      const left = rect.left - padding;
      const right = rect.right + padding;
      const top = rect.top - padding;
      const bottom = rect.bottom + padding;
      if (Math.abs(a.y - b.y) < 0.5) {
        const y = a.y;
        const minX = Math.min(a.x, b.x);
        const maxX = Math.max(a.x, b.x);
        return y >= top && y <= bottom && maxX >= left && minX <= right;
      }
      if (Math.abs(a.x - b.x) < 0.5) {
        const x = a.x;
        const minY = Math.min(a.y, b.y);
        const maxY = Math.max(a.y, b.y);
        return x >= left && x <= right && maxY >= top && minY <= bottom;
      }
      return false;
    }
    function routeIntersectsObstacles(route, obstacles) {
      for (let i = 1; i < route.length; i += 1) {
        if (obstacles.some((rect) => segmentIntersectsRect(route[i - 1], route[i], rect))) {
          return true;
        }
      }
      return false;
    }
    function branchChildRoute(start, end, side, obstacles, layoutRect) {
      const sign = side === 'left' ? -1 : 1;
      const gap = Math.max(4, Math.abs(end.x - start.x));
      const gutterX = start.x + sign * Math.min(4, Math.max(3, gap / 8));
      const base = [start, { x: gutterX, y: start.y }, { x: gutterX, y: end.y }, end];
      if (!routeIntersectsObstacles(base, obstacles)) {
        return base;
      }
      const corridorMin = Math.min(gutterX, end.x) - 4;
      const corridorMax = Math.max(gutterX, end.x) + 4;
      const blockers = obstacles.filter((rect) => rect.right >= corridorMin && rect.left <= corridorMax);
      if (!blockers.length) {
        return base;
      }
      const minTop = Math.min(...blockers.map((rect) => rect.top));
      const maxBottom = Math.max(...blockers.map((rect) => rect.bottom));
      const wantsLowerRoute = end.y >= start.y;
      const bottomLimit = layoutRect.height - 18;
      const topCandidate = Math.max(10, minTop - 10);
      const bottomCandidate = Math.min(bottomLimit, maxBottom + 10);
      const detourY = wantsLowerRoute || topCandidate < 12 ? bottomCandidate : topCandidate;
      const detour = [start, { x: gutterX, y: start.y }, { x: gutterX, y: detourY }, { x: end.x, y: detourY }, end];
      return routeIntersectsObstacles(detour, obstacles) ? base : detour;
    }
    function shiftedDotPoint(point, side, target) {
      const offset = target ? 3.4 : 2.2;
      const sign = side === 'left' ? 1 : -1;
      return { x: point.x + sign * offset, y: point.y };
    }
    function appendConnector(svg, route, color, role, side, sourceId, targetId, strokeWidth, opacity) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathFromPoints(route));
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', strokeWidth);
      path.setAttribute('opacity', opacity);
      path.setAttribute('data-kind', role === 'root-h2' ? 'root-branch' : 'branch-child');
      path.setAttribute('data-connector-role', role);
      path.setAttribute('data-side', side);
      path.setAttribute('data-source-id', sourceId);
      path.setAttribute('data-target-id', targetId);
      path.setAttribute('data-route-points', JSON.stringify(route.map((point) => [Number(point.x.toFixed(1)), Number(point.y.toFixed(1))])));
      svg.appendChild(path);
      const targetDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const dotPoint = shiftedDotPoint(route[route.length - 1], side, true);
      targetDot.setAttribute('cx', dotPoint.x.toFixed(1));
      targetDot.setAttribute('cy', dotPoint.y.toFixed(1));
      targetDot.setAttribute('r', role === 'root-h2' ? '3.7' : '3.1');
      targetDot.setAttribute('stroke', color);
      targetDot.setAttribute('class', 'connector-dot connector-target');
      targetDot.setAttribute('data-connector-role', role);
      targetDot.setAttribute('data-source-id', sourceId);
      targetDot.setAttribute('data-target-id', targetId);
      targetDot.setAttribute('data-side', side);
      svg.appendChild(targetDot);
      if (role === 'branch-child') {
        const sourceDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const sourcePoint = shiftedDotPoint(route[0], side, false);
        sourceDot.setAttribute('cx', sourcePoint.x.toFixed(1));
        sourceDot.setAttribute('cy', sourcePoint.y.toFixed(1));
        sourceDot.setAttribute('r', '2.2');
        sourceDot.setAttribute('stroke', color);
        sourceDot.setAttribute('class', 'connector-dot connector-source');
        sourceDot.setAttribute('data-connector-role', role);
        sourceDot.setAttribute('data-source-id', sourceId);
        sourceDot.setAttribute('data-target-id', targetId);
        sourceDot.setAttribute('data-side', side);
        svg.appendChild(sourceDot);
      }
      return path;
    }
    function drawBalancedConnectors() {
      const layout = document.querySelector('.balanced-layout');
      if (!layout) return 0;
      const svg = layout.querySelector('.balanced-live-connectors');
      const root = layout.querySelector('.balanced-root');
      if (!svg || !root) return 0;
      const layoutRect = layout.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${layoutRect.width.toFixed(0)} ${layoutRect.height.toFixed(0)}`);
      svg.setAttribute('width', layoutRect.width.toFixed(0));
      svg.setAttribute('height', layoutRect.height.toFixed(0));
      svg.replaceChildren();

      const rootRect = rectInLayout(root, layoutRect);
      let count = 0;
      layout.querySelectorAll('.balanced-branch').forEach((branch) => {
        const side = branch.dataset.side || 'right';
        const hub = branch.querySelector('.balanced-hub');
        if (!hub) return;
        const color = getComputedStyle(branch).getPropertyValue('--branch-color').trim() || '#1f4e5f';
        const hubRect = rectInLayout(hub, layoutRect);
        const rootPortSide = side === 'left' ? 'left' : 'right';
        const hubPortSide = side === 'left' ? 'right' : 'left';
        const rootStart = edgePort(rootRect, rootPortSide, hubRect.cy, 26);
        const hubEnd = edgePort(hubRect, hubPortSide, rootStart.y, 18);
        appendConnector(
          svg,
          connectorRoute(rootStart, hubEnd, side, 'root-h2'),
          color,
          'root-h2',
          side,
          root.dataset.nodeId || 'root',
          hub.dataset.nodeId || branch.dataset.nodeId || '',
          '2.5',
          '0.36'
        );
        count += 1;

        const childEntries = Array.from(branch.querySelectorAll('.balanced-branch-children > .balanced-node')).map((child) => ({
          child,
          rect: rectInLayout(child, layoutRect)
        }));
        childEntries.forEach(({ child, rect: childRect }) => {
          const obstacles = childEntries.filter((entry) => entry.child !== child).map((entry) => entry.rect);
          const hubStart = edgePort(hubRect, side === 'left' ? 'left' : 'right', childRect.cy, 15);
          const childEnd = edgePort(childRect, side === 'left' ? 'right' : 'left', hubStart.y, 12);
          appendConnector(
            svg,
            branchChildRoute(hubStart, childEnd, side, obstacles, layoutRect),
            color,
            'branch-child',
            side,
            hub.dataset.nodeId || branch.dataset.nodeId || '',
            child.dataset.nodeId || '',
            '1.45',
            '0.42'
          );
          count += 1;
        });
      });
      return count;
    }
    function renderMath() {
      if (!window.renderMathInElement) return;
      window.renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
      });
    }
    window.setTimeout(function markReady() {
      renderMath();
      const mode = document.body.dataset.layoutMode;
      const connectorCount = mode === 'balanced_two_sided' ? drawBalancedConnectors() : 0;
      window.MIND_MASTER_READY = mode === 'balanced_two_sided'
        ? !!document.querySelector('.balanced-layout') && connectorCount > 0
        : !!document.querySelector('.markmap svg');
    }, 1800);
    window.addEventListener('load', function () {
      window.setTimeout(drawBalancedConnectors, 150);
      window.setTimeout(drawBalancedConnectors, 900);
      window.setTimeout(drawBalancedConnectors, 1800);
    });
    window.addEventListener('resize', drawBalancedConnectors);
  </script>
</body>
</html>
